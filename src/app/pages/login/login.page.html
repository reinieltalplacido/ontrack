<ion-content [fullscreen]="true" class="login-content">
  <div class="login-container">
    
    <!-- Top Back Navigation -->
    <div class="top-nav">
      <button class="back-btn" (click)="goBack()" aria-label="Go back">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
    </div>

    <!-- Title & Greeting -->
    <div class="header-section">
      <div class="header-brand-row">
        <img src="assets/icon/ontrack-logo.png" alt="OnTrack Logo" class="login-full-logo" (click)="configureServerUrl()" style="cursor: pointer;" title="Tap logo to configure backend server IP" />
      </div>
      <h1 class="page-title">Welcome Back</h1>
      <p class="page-subtitle">Enter your student ID, faculty ID, or email to access your OnTrack portal.</p>
    </div>

    <!-- Error Banner -->
    <div class="error-banner" *ngIf="errorMessage" (click)="configureServerUrl()" style="cursor: pointer;" title="Tap to configure backend server IP">
      <ion-icon name="alert-circle-outline"></ion-icon>
      <span>{{ errorMessage }} <br><small style="text-decoration: underline;">Tap to configure server IP for mobile APK</small></span>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="form-container">
      
      <!-- Student Number / Faculty ID / Email Field -->
      <div class="input-group">
        <label class="input-label" for="email">Student No., Faculty ID, or Email</label>
        <div class="custom-input-box" [class.has-error]="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">
          <ion-icon name="mail-outline" class="input-icon"></ion-icon>
          <input 
            id="email"
            type="text" 
            formControlName="email"
            placeholder="e.g. SUM2023-00712 or admin@neust.edu.ph"
            autocomplete="username"
          />
        </div>
        <p class="error-hint" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')">
          Identification or email is required.
        </p>
      </div>

      <!-- Password Field -->
      <div class="input-group">
        <label class="input-label" for="password">Password</label>
        <div class="custom-input-box" [class.has-error]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">
          <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
          <input 
            id="password"
            [type]="showPassword ? 'text' : 'password'" 
            formControlName="password"
            placeholder="Enter your password"
            autocomplete="current-password"
          />
          <button type="button" class="eye-toggle-btn" (click)="togglePasswordVisibility()" aria-label="Toggle password">
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>
        <p class="error-hint" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')">
          Password is required.
        </p>
        <p class="error-hint" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('minlength')">
          Password must be at least 6 characters.
        </p>
      </div>

      <!-- Remember Me Checkbox -->
      <div class="options-row">
        <label class="remember-label">
          <input type="checkbox" formControlName="rememberMe" />
          <span>Keep me signed in</span>
        </label>
      </div>

      <!-- Submit Button -->
      <div class="submit-wrapper">
        <ion-button 
          expand="block" 
          type="submit" 
          class="ot-btn-primary login-btn"
          [disabled]="isLoading">
          <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
          <span *ngIf="!isLoading">Sign In</span>
          <ion-icon *ngIf="!isLoading" name="log-in-outline" slot="end"></ion-icon>
        </ion-button>
      </div>

    </form>

    <!-- Bottom Signup Prompt -->
    <div class="signup-footer">
      <p>Don't have an OnTrack account?</p>
      <button class="signup-btn" (click)="goToRegister()">Create Student Account</button>
    </div>

  </div>
</ion-content>
